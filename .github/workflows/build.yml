
name: Build Windows Arcade Loader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: aderumier/windowsarcadeloader
          ref: master
          fetch-depth: 0
          path: source

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 \
            mono-mcs \
            pkg-config

      - name: Build and install SDL3
        run: |
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libdecor-0-dev \
            libdbus-1-dev \
            libudev-dev \
            libasound2-dev \
            libpulse-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libibus-1.0-dev

          git clone --depth 1 \
            https://github.com/libsdl-org/SDL.git \
            /tmp/SDL

          cmake -S /tmp/SDL -B /tmp/SDL/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF

          cmake --build /tmp/SDL/build --parallel 2
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add \
            i686-pc-windows-gnu \
            x86_64-pc-windows-gnu

      - name: Compile
        working-directory: source
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package results
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          BASE="5dba7ffc1f2dfbf9d701a08483f2ceb8879414f3"

          git cat-file -e "${BASE}^{commit}"

          mkdir -p ../package/payloads ../package/changed-files

          cp -a dist/arcade-launcher ../package/

          if [ -d dist/payloads ]; then
            cp -a dist/payloads/. ../package/payloads/
          fi

          git diff --name-only --diff-filter=ACMRT \
            "${BASE}...HEAD" -- '*.yaml' '*.yml' |
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "../package/changed-files/$(dirname "$file")"
            cp "$file" "../package/changed-files/$file"
          done

          {
            echo "Base commit: $BASE"
            echo "Build commit: $(git rev-parse HEAD)"
          } > ../package/BUILD-INFO.txt

          tar -czf ../windowsarcadeloader-since-5dba7ff.tar.gz \
            -C ../package .

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: windowsarcadeloader-since-5dba7ff
          path: windowsarcadeloader-since-5dba7ff.tar.gz
          if-no-files-found: error
          retention-days: 14
