
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30

          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            build-essential \
            gcc-mingw-w64-i686-posix \
            gcc-mingw-w64-x86-64-posix \
            mono-mcs \
            pkg-config \
            cmake \
            git

      - name: Build and install SDL3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL

          cmake -S /tmp/SDL -B /tmp/SDL/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF

          cmake --build /tmp/SDL/build --parallel 2
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig

          echo "=== Vérification SDL3 ==="
          ldconfig -p | grep SDL3
